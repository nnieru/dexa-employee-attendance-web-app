server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Same-origin API access, so the web apps need no CORS setup or absolute API URL. The gateway
  # keeps its /api/v1 prefix, because proxy_pass without a URI passes the request path unchanged.
  location /api/ {
    proxy_pass http://api-gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The HR notification stream is Server-Sent Events, so buffering would delay its events.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
