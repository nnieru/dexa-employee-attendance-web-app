# Local infrastructure. Application containers start with: docker compose --profile apps up --build
name: dexa-attendance

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD:?set EMPLOYEE_DB_PASSWORD in .env}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?set ATTENDANCE_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?set AUDIT_DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP: api-gateway
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      AUTH_SERVICE_INTERNAL_URL: http://auth-service:3000
      EMPLOYEE_SERVICE_INTERNAL_URL: http://employee-service:3000
      ATTENDANCE_SERVICE_INTERNAL_URL: http://attendance-service:3000
      USER_JWT_ISSUER: ${USER_JWT_ISSUER:-auth-service}
      USER_JWT_AUDIENCE: ${USER_JWT_AUDIENCE:-dexa-api}
      USER_JWT_PUBLIC_KEY: ${USER_JWT_PUBLIC_KEY:-}
      SERVICE_JWT_PRIVATE_KEY: ${API_GATEWAY_SERVICE_JWT_PRIVATE_KEY:-}
      API_GATEWAY_SERVICE_JWT_PUBLIC_KEY: ${API_GATEWAY_SERVICE_JWT_PUBLIC_KEY:-}
      AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY: ${AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY:-}
    ports:
      - '127.0.0.1:3000:3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  auth-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP: auth-service
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL_CONTAINER:-}
      RABBITMQ_URL: ${RABBITMQ_URL_CONTAINER:-}
      AUTH_BOOTSTRAP_HR_EMAIL: ${AUTH_BOOTSTRAP_HR_EMAIL:-}
      AUTH_BOOTSTRAP_HR_PASSWORD: ${AUTH_BOOTSTRAP_HR_PASSWORD:-}
      USER_JWT_ISSUER: ${USER_JWT_ISSUER:-auth-service}
      USER_JWT_AUDIENCE: ${USER_JWT_AUDIENCE:-dexa-api}
      USER_JWT_PUBLIC_KEY: ${USER_JWT_PUBLIC_KEY:-}
      USER_JWT_PRIVATE_KEY: ${USER_JWT_PRIVATE_KEY:-}
      SERVICE_JWT_PRIVATE_KEY: ${AUTH_SERVICE_SERVICE_JWT_PRIVATE_KEY:-}
      API_GATEWAY_SERVICE_JWT_PUBLIC_KEY: ${API_GATEWAY_SERVICE_JWT_PUBLIC_KEY:-}
      AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY: ${AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY:-}
    ports:
      - '127.0.0.1:3001:3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  employee-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP: employee-service
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      EMPLOYEE_DATABASE_URL: ${EMPLOYEE_DATABASE_URL_CONTAINER:-}
      RABBITMQ_URL: ${RABBITMQ_URL_CONTAINER:-}
      EMPLOYEE_MASTER_DATA: ${EMPLOYEE_MASTER_DATA:-}
      EMPLOYEE_BOOTSTRAP_HR_EMAIL: ${EMPLOYEE_BOOTSTRAP_HR_EMAIL:-}
      EMPLOYEE_BOOTSTRAP_HR_NAME: ${EMPLOYEE_BOOTSTRAP_HR_NAME:-}
      EMPLOYEE_BOOTSTRAP_HR_POSITION_CODE: ${EMPLOYEE_BOOTSTRAP_HR_POSITION_CODE:-}
      EMPLOYEE_PHOTO_DIRECTORY: /var/lib/dexa/employee-photos
      AUTH_SERVICE_INTERNAL_URL: http://auth-service:3000
      USER_JWT_ISSUER: ${USER_JWT_ISSUER:-auth-service}
      USER_JWT_AUDIENCE: ${USER_JWT_AUDIENCE:-dexa-api}
      USER_JWT_PUBLIC_KEY: ${USER_JWT_PUBLIC_KEY:-}
      SERVICE_JWT_PRIVATE_KEY: ${EMPLOYEE_SERVICE_SERVICE_JWT_PRIVATE_KEY:-}
      API_GATEWAY_SERVICE_JWT_PUBLIC_KEY: ${API_GATEWAY_SERVICE_JWT_PUBLIC_KEY:-}
      AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY: ${AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY:-}
    ports:
      - '127.0.0.1:3002:3000'
    # The container root is read-only, so uploaded photos live in this named volume (DATABASE §4.2).
    volumes:
      - employee-photos:/var/lib/dexa/employee-photos
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  attendance-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP: attendance-service
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      ATTENDANCE_DATABASE_URL: ${ATTENDANCE_DATABASE_URL_CONTAINER:-}
      # Blank means the schema's PRD default (Mon-Fri 09:00-18:00, late check-in grace 15).
      ATTENDANCE_DEFAULT_SCHEDULE_WORKING_WEEKDAYS: ${ATTENDANCE_DEFAULT_SCHEDULE_WORKING_WEEKDAYS:-}
      ATTENDANCE_DEFAULT_SCHEDULE_START_TIME: ${ATTENDANCE_DEFAULT_SCHEDULE_START_TIME:-}
      ATTENDANCE_DEFAULT_SCHEDULE_END_TIME: ${ATTENDANCE_DEFAULT_SCHEDULE_END_TIME:-}
      ATTENDANCE_DEFAULT_SCHEDULE_LATE_CHECKIN_GRACE_MINUTES: ${ATTENDANCE_DEFAULT_SCHEDULE_LATE_CHECKIN_GRACE_MINUTES:-}
      ATTENDANCE_DEFAULT_SCHEDULE_EARLY_CHECKOUT_GRACE_MINUTES: ${ATTENDANCE_DEFAULT_SCHEDULE_EARLY_CHECKOUT_GRACE_MINUTES:-}
      ATTENDANCE_DEFAULT_SCHEDULE_LATE_CHECKOUT_GRACE_MINUTES: ${ATTENDANCE_DEFAULT_SCHEDULE_LATE_CHECKOUT_GRACE_MINUTES:-}
      AUTH_SERVICE_INTERNAL_URL: http://auth-service:3000
      EMPLOYEE_SERVICE_INTERNAL_URL: http://employee-service:3000
      USER_JWT_ISSUER: ${USER_JWT_ISSUER:-auth-service}
      USER_JWT_AUDIENCE: ${USER_JWT_AUDIENCE:-dexa-api}
      USER_JWT_PUBLIC_KEY: ${USER_JWT_PUBLIC_KEY:-}
      SERVICE_JWT_PRIVATE_KEY: ${ATTENDANCE_SERVICE_SERVICE_JWT_PRIVATE_KEY:-}
      API_GATEWAY_SERVICE_JWT_PUBLIC_KEY: ${API_GATEWAY_SERVICE_JWT_PUBLIC_KEY:-}
      AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY: ${AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY:-}
    ports:
      - '127.0.0.1:3003:3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP: notification-service
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL_CONTAINER:-}
      RABBITMQ_URL: ${RABBITMQ_URL_CONTAINER:-}
      AUTH_SERVICE_INTERNAL_URL: http://auth-service:3000
      EMPLOYEE_SERVICE_INTERNAL_URL: http://employee-service:3000
      USER_JWT_ISSUER: ${USER_JWT_ISSUER:-auth-service}
      USER_JWT_AUDIENCE: ${USER_JWT_AUDIENCE:-dexa-api}
      USER_JWT_PUBLIC_KEY: ${USER_JWT_PUBLIC_KEY:-}
      SERVICE_JWT_PRIVATE_KEY: ${NOTIFICATION_SERVICE_SERVICE_JWT_PRIVATE_KEY:-}
      API_GATEWAY_SERVICE_JWT_PUBLIC_KEY: ${API_GATEWAY_SERVICE_JWT_PUBLIC_KEY:-}
      AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${AUTH_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${EMPLOYEE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${ATTENDANCE_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY: ${NOTIFICATION_SERVICE_SERVICE_JWT_PUBLIC_KEY:-}
      AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY: ${AUDIT_WORKER_SERVICE_JWT_PUBLIC_KEY:-}
    ports:
      - '127.0.0.1:3004:3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  audit-worker:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP: audit-worker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL_CONTAINER:-}
      RABBITMQ_URL: ${RABBITMQ_URL_CONTAINER:-}
    ports:
      - '127.0.0.1:3005:3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  employee-web:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: employee-web
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp, /var/cache/nginx, /var/run]

  admin-web:
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: admin-web
    ports:
      - '127.0.0.1:8081:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp, /var/cache/nginx, /var/run]

volumes:
  postgres-data:
  rabbitmq-data:
  employee-photos:
